name: Release

# Triggered by scripts/bump-version.ps1 pushing a vX.Y.Z tag.
# Asset names matter: the in-app updater downloads releases/download/v<version>/grzyClothTool.zip and expects
# grzyClothTool.exe at the zip root; grzyOptimizer's self-update downloads grzyOptimizer.zip with grzyOptimizer.exe at its root.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Tags and full history, so the notes can diff against the last release.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check tag matches FileVersion
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          [xml]$proj = Get-Content grzyClothTool/grzyClothTool.csproj
          $fileVersion = ($proj.Project.PropertyGroup.FileVersion | Where-Object { $_ }) | Select-Object -First 1
          if ($fileVersion -ne $version) {
            throw "Tag ${{ github.ref_name }} does not match <FileVersion>$fileVersion</FileVersion>"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      # CodeWalker builds into packages/, which every other project references via HintPath.
      - name: Build CodeWalker
        run: dotnet build CodeWalker/CodeWalker/CodeWalker.csproj -c Release

      - name: Publish app
        run: dotnet publish grzyClothTool/grzyClothTool.csproj -c Release -r win-x64 -o out/app

      - name: Publish optimizer CLI
        run: dotnet publish grzyClothTool.Optimizer.Cli/grzyClothTool.Optimizer.Cli.csproj -c Release -r win-x64 -o out/cli

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/app/* -DestinationPath dist/grzyClothTool.zip
          Compress-Archive -Path out/cli/* -DestinationPath dist/grzyOptimizer.zip

      # Release notes: commits pushed straight to master since the previous tag,
      # plus GitHub's generated list of merged pull requests (whose own commits
      # are left out of the first list, being off the first-parent line).
      - name: Release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_name }}'
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          range=${prev:+$prev..}$tag

          # Version bump commits (":bookmark: v1.5.4") are left out.
          commits=$(git log "$range" --first-parent --no-merges --format='%h %H %s' \
            | grep -Ev '^[0-9a-f]+ [0-9a-f]+ (:bookmark: |🔖 )?v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | while read -r short full subject; do
                echo "- $subject ([\`$short\`](${{ github.server_url }}/${{ github.repository }}/commit/$full))"
              done)

          generated=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            ${prev:+-f previous_tag_name="$prev"} --jq .body)

          {
            echo 'Download **`grzyClothTool.zip`**, extract it and run `grzyClothTool.exe`. Existing installs update themselves.'
            echo '`grzyOptimizer.zip` is the standalone optimizer CLI.'
            if [ -n "$commits" ]; then
              echo
              echo '## Commits'
              echo "$commits"
            fi
            echo
            echo "$generated"
          } > dist/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist/grzyClothTool.zip dist/grzyOptimizer.zip `
            --title "v$env:VERSION" --notes-file dist/notes.md --verify-tag
